<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Álbum 04 | Vitor Gomes Fotografia</title><style>body{margin:0;background:#2b000b;color:#fff;font-family:Arial,sans-serif}.album-header{background:#270008;text-align:center;padding:22px 18px}.album-header img{width:min(250px,70vw);height:auto}.album-nav{display:flex;justify-content:space-between;max-width:1160px;margin:0 auto;padding:22px 20px}.album-nav a{color:#fff;text-decoration:none}.album-intro{text-align:center;padding:28px 18px 36px}.album-intro h1{font-weight:400;font-size:clamp(26px,4vw,46px);margin:0 0 12px}.album-intro p{color:#e6cbd1}.album-grid{max-width:1160px;margin:0 auto;padding:0 18px 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.album-grid button{display:block;padding:0;background:transparent;border:0;cursor:zoom-in}.album-grid img{display:block;width:100%;height:auto;border-radius:5px}.lightbox{position:fixed;inset:0;background:rgba(10,0,3,.96);z-index:999;display:none;align-items:center;justify-content:center;padding:55px 55px;box-sizing:border-box}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:100%;object-fit:contain}.lightbox button{position:absolute;border:0;background:#5a1a2b;color:white;font-size:25px;cursor:pointer;padding:9px 16px}.lightbox .close{top:12px;right:16px}.lightbox .prev{left:8px}.lightbox .next{right:8px}.lightbox .counter{position:absolute;bottom:13px;color:#fff;font-size:13px}@media(max-width:650px){.album-grid{grid-template-columns:1fr}.lightbox{padding:55px 35px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header class="album-header"><a href="index.html"><img src="assets/img/vitor-gomes-logo-header.png" alt="Vitor Gomes Fotografia"></a></header><nav class="album-nav"><a href="index.html#trabalhos">← Trabalhos recentes</a><span>Álbum 04 · 5 fotos</span></nav><section class="album-intro"><h1>ENSAIO FOTOGRÁFICO</h1><p>Ensaio Fotográfico · Retrato · Ibirubá</p></section><main class="album-grid"><button type="button" data-index="0" aria-label="Ampliar fotografia 1"><img loading="lazy" src="assets/img/album-04/foto-01.png" alt="Fotografia 1 do álbum 04"></button><button type="button" data-index="1" aria-label="Ampliar fotografia 2"><img loading="lazy" src="assets/img/album-04/foto-02.png" alt="Fotografia 2 do álbum 04"></button><button type="button" data-index="2" aria-label="Ampliar fotografia 3"><img loading="lazy" src="assets/img/album-04/foto-03.png" alt="Fotografia 3 do álbum 04"></button><button type="button" data-index="3" aria-label="Ampliar fotografia 4"><img loading="lazy" src="assets/img/album-04/foto-04.png" alt="Fotografia 4 do álbum 04"></button><button type="button" data-index="4" aria-label="Ampliar fotografia 5"><img loading="lazy" src="assets/img/album-04/foto-05.png" alt="Fotografia 5 do álbum 04"></button></main><div class="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de fotografias"><button class="close" aria-label="Fechar">×</button><button class="prev" aria-label="Anterior">‹</button><img alt="Fotografia ampliada"><button class="next" aria-label="Próxima">›</button><span class="counter"></span></div><script>const imgs=[...document.querySelectorAll('.album-grid img')];const box=document.querySelector('.lightbox'),large=box.querySelector('img');let current=0;function show(i){current=(i+imgs.length)%imgs.length;large.src=imgs[current].src;large.alt=imgs[current].alt;box.querySelector('.counter').textContent=(current+1)+' / '+imgs.length;}document.querySelectorAll('.album-grid button').forEach((b,i)=>b.addEventListener('click',()=>{show(i);box.classList.add('open');box.querySelector('.close').focus();}));function close(){box.classList.remove('open');large.removeAttribute('src');}box.querySelector('.close').onclick=close;box.querySelector('.prev').onclick=()=>show(current-1);box.querySelector('.next').onclick=()=>show(current+1);box.addEventListener('click',e=>{if(e.target===box)close();});document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);});</script></body></html>
